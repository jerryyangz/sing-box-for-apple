name: Build SFT tvOS16 IPA (legacy, Xcode 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Select Xcode 15.4 (tvOS 17.5 SDK, Swift 5.10)
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos

      - name: Checkout sing-box core (v1.10.7)
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.10.7
          path: core

      - name: Checkout sing-box-for-apple (2024-12-28, v1.10.6, Xcode 15 project)
        uses: actions/checkout@v4
        with:
          repository: jerryyangz/sing-box-for-apple
          ref: 3d889ae0175fb7048d1c0ba229b2ba6c069690a5
          path: apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Libbox (tvOS slice only)
        working-directory: core
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile version || true
          go run ./cmd/internal/build_libbox -target apple -platform tvos/arm64
          ls -la Libbox.xcframework

      - name: Place Libbox.xcframework into apple project
        run: |
          cp -R core/Libbox.xcframework apple/Libbox.xcframework

      - name: Patch client (fix tvOS 16 log page crash)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib

          def edit(path, old, new, label):
              p = pathlib.Path(path)
              s = p.read_text(encoding='utf-8')
              if new in s:
                  print('already patched:', label)
                  return
              assert old in s, 'anchor missing: ' + label
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('patched:', label)

          # 1) 修复 tvOS 16 点日志页闪退：整页换成只用 tvOS 13 级别 API 的实现
          #    去掉 focusEffectDisabled(tvOS 17)、ScrollViewReader、LazyVGrid、
          #    onChangeCompat、动态 Range 的 ForEach
          #    必须保留上游行为：进入页面要 connectLog()，否则日志永远不连接（只会显示未连接）
          lv = pathlib.Path('apple/ApplicationLibrary/Views/Log/LogView.swift')
          lv.write_text('\n'.join([
              'import Foundation',
              'import Library',
              'import SwiftUI',
              '',
              'public struct LogView: View {',
              '    @EnvironmentObject private var environments: ExtensionEnvironments',
              '',
              '    public init() {}',
              '',
              '    public var body: some View {',
              '        LogPage(environments: environments, logClient: environments.logClient)',
              '    }',
              '}',
              '',
              'private struct LogPage: View {',
              '    let environments: ExtensionEnvironments',
              '    @ObservedObject var logClient: CommandClient',
              '',
              '    private let logFont = Font.system(.caption2, design: .monospaced)',
              '',
              '    private var lines: [String] {',
              '        Array(logClient.logList.reversed())',
              '    }',
              '',
              '    var body: some View {',
              '        VStack(alignment: .leading, spacing: 6) {',
              '            Text(logClient.isConnected ? "Logs (connected)" : "Logs (service not started)")',
              '                .font(.caption)',
              '            ScrollView {',
              '                VStack(alignment: .leading, spacing: 2) {',
              '                    ForEach(Array(lines.enumerated()), id: \\.offset) { item in',
              '                        Text(item.element)',
              '                            .font(logFont)',
              '                            .frame(maxWidth: .infinity, alignment: .leading)',
              '                            .focusable()',
              '                    }',
              '                }',
              '                .padding()',
              '            }',
              '        }',
              '        .frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .topLeading)',
              '        .padding()',
              '        .task {',
              '            for _ in 0 ..< 20 {',
              '                environments.connectLog()',
              '                if logClient.isConnected {',
              '                    return',
              '                }',
              '                try? await Task.sleep(nanoseconds: 300 * NSEC_PER_MSEC)',
              '            }',
              '        }',
              '    }',
              '}',
              '',
          ]), encoding='utf-8')
          print('rewritten: LogView.swift (tvOS 13-safe minimal implementation)')

          # 2) CommandClient 去掉强制解包，避免 Libbox 初始化返回 nil 时直接崩溃
          edit('apple/Library/Network/CommandClient.swift',
               '        let client = LibboxNewCommandClient(clientHandler(self), clientOptions)!\n        do {',
               '        guard let client = LibboxNewCommandClient(clientHandler(self), clientOptions) else {\n            NSLog("CommandClient: LibboxNewCommandClient returned nil")\n            return\n        }\n        do {',
               'CommandClient.swift (force unwrap)')

          edit('apple/Library/Network/CommandClient.swift',
               '                commandClient.clashModeList = modeList!.toArray()\n                commandClient.clashMode = currentMode!',
               '                commandClient.clashModeList = modeList?.toArray() ?? []\n                commandClient.clashMode = currentMode ?? ""',
               'CommandClient.swift (clash mode unwrap)')

          print('done')
          PY
          echo "--- patch check ---"
          grep -q "LogPage" apple/ApplicationLibrary/Views/Log/LogView.swift
          grep -q "guard let client = LibboxNewCommandClient" apple/Library/Network/CommandClient.swift
          grep -q "Logs (connected)" apple/ApplicationLibrary/Views/Log/LogView.swift
          grep -q "environments.connectLog()" apple/ApplicationLibrary/Views/Log/LogView.swift
          grep -q "focusable()" apple/ApplicationLibrary/Views/Log/LogView.swift
          if grep -q "focusEffectDisabled" apple/ApplicationLibrary/Views/Log/LogView.swift; then
            echo "!! LogView 仍含 tvOS 17 专属 API focusEffectDisabled"; exit 1
          fi
          swiftc -parse apple/ApplicationLibrary/Views/Log/LogView.swift
          echo "OK: LogView 重写完成，且保留 connectLog() / focusable()"

      - name: Patch client (sponsor QR banner in settings)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          #!/usr/bin/env python3
          # CI 内运行的 SettingView 赞助横幅补丁脚本（base64 占位符由外部替换）
          import pathlib

          B64_DOUYIN = ''
          B64_YOUTUBE = ''
          B64_BILIBILI = ''


          def swift_b64_lines(name, b64):
              # Swift 字符串字面量单 token 上限 65535 字符，长 base64 必须分片用 + 拼接
              parts = [b64[i:i + 20000] for i in range(0, len(b64), 20000)]
              lines = ['    static let %s =' % name]
              for i, part in enumerate(parts):
                  lines.append('        "%s"%s' % (part, ' +' if i < len(parts) - 1 else ''))
              return lines

          # SettingView.swift 尾部整体重写：
          #   1) 保留原 Debug section（Taiwan Flag Available 一项原样）
          #   2) 追加「关注一三羊」二维码 Section（仅 tvOS）
          #   3) 文件末尾追加 SponsorQrBanner / SponsorQrCard / SponsorQR
          #      图片以 base64 内嵌，运行时解码为 UIImage，不改动 Xcode 工程资源
          SWIFT_TAIL = '\n'.join([
              '            Section("Debug") {',
              '                FormNavigationLink {',
              '                    ServiceLogView()',
              '                } label: {',
              '                    Label("Service Log", systemImage: "doc.on.clipboard")',
              '                }',
              '                FormTextItem("Taiwan Flag Available", "touchid") {',
              '                    if isLoading {',
              '                        Text("Loading...")',
              '                            .onAppear {',
              '                                Task.detached {',
              '                                    let available: Bool',
              '                                    if ApplicationLibrary.inPreview {',
              '                                        available = true',
              '                                    } else {',
              '                                        available = !DeviceCensorship.isChinaDevice()',
              '                                    }',
              '                                    await MainActor.run {',
              '                                        taiwanFlagAvailable = available',
              '                                        isLoading = false',
              '                                    }',
              '                                }',
              '                            }',
              '                    } else {',
              '                        Text(taiwanFlagAvailable.toString())',
              '                    }',
              '                }',
              '            }',
              '            #if os(tvOS)',
              '            Section(header: Text("关注一三羊")) {',
              '                SponsorQrBanner()',
              '            }',
              '            #endif',
              '        }',
              '    }',
              '}',
              '',
              '#if os(tvOS)',
              'struct SponsorQrBanner: View {',
              '    var body: some View {',
              '        VStack(spacing: 14) {',
              '            Text("扫码关注我的频道，获取更多内容")',
              '                .font(.subheadline)',
              '                .foregroundColor(.secondary)',
              '            HStack(spacing: 20) {',
              '                SponsorQrCard(b64: SponsorQR.douyin, title: "抖音", dot: Color(red: 0.998, green: 0.176, blue: 0.345))',
              '                SponsorQrCard(b64: SponsorQR.youtube, title: "YouTube", dot: Color.red)',
              '                SponsorQrCard(b64: SponsorQR.bilibili, title: "哔哩哔哩", dot: Color(red: 0.0, green: 0.682, blue: 0.925))',
              '            }',
              '            Text("感谢支持 ♥ 扫码关注！")',
              '                .font(.title3)',
              '                .bold()',
              '            Text("抖音 · YouTube · 哔哩哔哩，三端同步更新")',
              '                .font(.footnote)',
              '                .foregroundColor(.secondary)',
              '        }',
              '        .frame(maxWidth: .infinity)',
              '        .focusable()',
              '        .padding(.vertical, 8)',
              '    }',
              '}',
              '',
              'struct SponsorQrCard: View {',
              '    let b64: String',
              '    let title: String',
              '    let dot: Color',
              '',
              '    var body: some View {',
              '        VStack(spacing: 10) {',
              '            Group {',
              '                if let img = SponsorQR.image(b64) {',
              '                    Image(uiImage: img)',
              '                        .resizable()',
              '                        .scaledToFit()',
              '                } else {',
              '                    Color.black',
              '                }',
              '            }',
              '            .frame(width: 240, height: 284)',
              '            .clipShape(RoundedRectangle(cornerRadius: 12))',
              '            HStack(spacing: 8) {',
              '                Circle()',
              '                    .fill(dot)',
              '                    .frame(width: 12, height: 12)',
              '                Text(title)',
              '                    .font(.body)',
              '                    .bold()',
              '                    .foregroundColor(.black)',
              '            }',
              '        }',
              '        .padding(14)',
              '        .background(RoundedRectangle(cornerRadius: 22).fill(Color.white))',
              '    }',
              '}',
              '',
              'enum SponsorQR {',
          ] + swift_b64_lines('douyin', B64_DOUYIN) + swift_b64_lines('youtube', B64_YOUTUBE) + swift_b64_lines('bilibili', B64_BILIBILI) + [
              '',
              '    static func image(_ b64: String) -> UIImage? {',
              '        guard let data = Data(base64Encoded: b64) else {',
              '            return nil',
              '        }',
              '        return UIImage(data: data)',
              '    }',
              '}',
              '#endif',
              '',
          ])

          TARGET = 'apple/ApplicationLibrary/Views/Setting/SettingView.swift'
          p = pathlib.Path(TARGET)
          s = p.read_text(encoding='utf-8')
          if 'SponsorQrBanner' in s:
              print('already patched: SettingView.swift')
          else:
              # 显式引入 UIKit / Foundation，不依赖 SwiftUI 的 re-export（tvOS 上 UIImage 必须可用）
              if 'import UIKit' not in s:
                  s = s.replace('import SwiftUI', '#if canImport(UIKit)\nimport UIKit\n#endif\nimport SwiftUI', 1)
                  print('import UIKit added')
              anchor = '            Section("Debug") {'
              assert anchor in s, 'anchor missing: Section("Debug")'
              idx = s.index(anchor)
              p.write_text(s[:idx] + SWIFT_TAIL, encoding='utf-8')
              print('patched: SettingView.swift (sponsor banner appended)')

          PY
          echo "--- sponsor patch check ---"
          grep -q "SponsorQrBanner" apple/ApplicationLibrary/Views/Setting/SettingView.swift
          grep -q "import UIKit" apple/ApplicationLibrary/Views/Setting/SettingView.swift
          grep -q "关注一三羊" apple/ApplicationLibrary/Views/Setting/SettingView.swift
          grep -q "感谢支持" apple/ApplicationLibrary/Views/Setting/SettingView.swift
          swiftc -parse apple/ApplicationLibrary/Views/Setting/SettingView.swift
          echo "OK: 设置页二维码横幅已注入（关注一三羊）"
      - name: Archive SFT (unsigned, tvOS 16.1 target)
        working-directory: apple
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -scheme SFT \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/SFT.xcarchive \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            TVOS_DEPLOYMENT_TARGET=16.1 \
            MARKETING_VERSION=1.10.6 \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -disable-availability-checking' \
            OTHER_LDFLAGS='$(inherited) -weak_framework _DeviceDiscoveryUI_SwiftUI' \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DISABLE_SWIFTLINT=1 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tee archive.log || {
              echo "===== COMPILE ERRORS ====="
              grep -E "error:" archive.log | head -40 || true
              echo "===== TAIL ====="
              tail -60 archive.log
              exit 1
            }

      - name: Assemble IPA payload
        run: |
          set -euo pipefail
          APP="apple/build/SFT.xcarchive/Products/Applications/sing-box.app"
          if [ ! -d "$APP" ]; then
            echo "!! expected app not found: $APP"
            echo "--- archive contents ---"
            find apple/build -maxdepth 5 | head -60 || true
            echo "--- tail of archive.log ---"
            tail -80 apple/archive.log || true
            exit 1
          fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          # 国内 IP 段走配置内联（sing-box-tvos-j.json），不再打包规则集文件
          # ldid: 注入 entitlements 并 fakesign（TrollStore 保留 entitlements）
          brew install ldid
          ENT_APP="apple/SFT/SFT.entitlements"
          ENT_EXT="apple/TVExtension/TVExtension.entitlements"
          test -f "$ENT_APP"
          test -f "$ENT_EXT"
          ldid -S"$ENT_EXT" "ipa/Payload/sing-box.app/PlugIns/TVExtension.appex/TVExtension"
          FWLIB=$(find ipa/Payload/sing-box.app -name "Library" -path "*Library.framework*" -type f)
          echo "FWLIB=$FWLIB"
          test -n "$FWLIB"
          ldid -S "$FWLIB"
          ldid -S"$ENT_APP" "ipa/Payload/sing-box.app/sing-box"
          echo "--- entitlements check (app) ---"
          ldid -e "ipa/Payload/sing-box.app/sing-box" || true
          echo "--- entitlements check (ext) ---"
          ldid -e "ipa/Payload/sing-box.app/PlugIns/TVExtension.appex/TVExtension" || true

      - name: Patch DeviceDiscovery to weak link (LC_LOAD_WEAK_DYLIB)
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import os, struct
          # ld64 的 -weak_framework 对该库未生效（SDK 里不存在此 framework，仍输出强链接
          # LC_LOAD_DYLIB）。原地把命令类型改为 LC_LOAD_WEAK_DYLIB = 0x18|0x80000000
          # = 0x80000018，ordinal 总数不变，chained fixups 安全。
          patched, already = [], []
          for root, dirs, files in os.walk('ipa/Payload'):
              for f in files:
                  p = os.path.join(root, f)
                  with open(p, 'rb') as fh:
                      data = bytearray(fh.read())
                  if len(data) < 40 or struct.unpack_from('<I', data, 0)[0] != 0xfeedfacf:
                      continue
                  ncmds = struct.unpack_from('<I', data, 16)[0]
                  pos = 32
                  changed = False
                  for _ in range(ncmds):
                      cmd, cmdsize = struct.unpack_from('<II', data, pos)
                      if cmd in (0xc, 0x18, 0x80000018):
                          off = struct.unpack_from('<I', data, pos + 8)[0]
                          end = data.find(b'\x00', pos + off)
                          name = bytes(data[pos + off:end]).decode('utf-8', 'replace')
                          if '_DeviceDiscoveryUI_SwiftUI' in name:
                              if cmd == 0xc:
                                  struct.pack_into('<I', data, pos, 0x80000018)
                                  changed = True
                                  patched.append(p)
                              else:
                                  already.append(p)
                      pos += cmdsize
                  if changed:
                      with open(p, 'wb') as fh:
                          fh.write(data)
          print('patched strong->weak:', patched)
          print('already weak:', already)
          if not patched and not already:
              print('NOTE: binary has no _DeviceDiscoveryUI_SwiftUI reference at all - nothing to patch, safe')
          PY

      - name: Verify archive (minos / weak link)
        run: |
          set -euo pipefail
          BIN="ipa/Payload/sing-box.app/sing-box"
          echo "--- LC_BUILD_VERSION ---"
          otool -l "$BIN" | grep -A4 LC_BUILD_VERSION | head -6
          echo "--- dylib 加载命令(weak 检查) ---"
          /usr/bin/python3 - "$BIN" <<'PY'
          import struct, sys
          # LC_LOAD_DYLIB=0xc, LC_LOAD_WEAK_DYLIB=0x18|LC_REQ_DYLD=0x80000018
          data = open(sys.argv[1], 'rb').read()
          ncmds = struct.unpack_from('<I', data, 16)[0]
          pos, weak, strong = 32, [], []
          for _ in range(ncmds):
              cmd, cmdsize = struct.unpack_from('<II', data, pos)
              if cmd in (0xc, 0x18, 0x80000018):
                  off = struct.unpack_from('<I', data, pos + 8)[0]
                  end = data.find(b'\x00', pos + off)
                  name = data[pos + off:end].decode('utf-8', 'replace').split('/')[-1]
                  (strong if cmd == 0xc else weak).append(name)
              pos += cmdsize
          print('weak:', weak)
          print('strong:', strong)
          assert '_DeviceDiscoveryUI_SwiftUI' not in strong, 'DeviceDiscovery 仍是强链接，tvOS 16.1 无法启动'
          print('OK: DeviceDiscovery 无强链接 (weak=%s)' % ('_DeviceDiscoveryUI_SwiftUI' in weak))
          PY
          echo "--- 日志页补丁是否编进产物（关键，上次漏检导致重装无效）---"
          HIT=$(grep -r -a -l "Logs (connected)" ipa/Payload || true)
          echo "命中文件: ${HIT:-<none>}"
          test -n "$HIT" || { echo "!! LogView 补丁未编进二进制"; exit 1; }
          echo "--- CommandClient 防崩溃补丁 ---"
          HIT2=$(grep -r -a -l "LibboxNewCommandClient returned nil" ipa/Payload || true)
          echo "命中文件: ${HIT2:-<none>}"
          test -n "$HIT2" || { echo "!! CommandClient 补丁未编进二进制"; exit 1; }
          echo "OK: 两个 Swift 补丁均已编进产物"
          echo "--- tvOS 17 专属 API 残留检查 (focusEffectDisabled) ---"
          if grep -a -q "ffectDisabled" ipa/Payload/sing-box.app/sing-box; then
            echo "!! 主二进制仍引用 focusEffectDisabled，日志页在 tvOS 16.1 必崩"; exit 1
          fi
          echo "OK: 主二进制已无 focusEffectDisabled 引用"
          echo "--- 设置页二维码横幅（关注一三羊）---"
          # 注意：macos-14 runner 的 BSD grep 按 UTF-8 locale 逐行解码，
          # Mach-O 二进制含大量非法 UTF-8 序列，多字节模式（中文）会失配；
          # 必须 LC_ALL=C 强制按字节匹配（ASCII 模式如 Logs (connected) 不受影响）
          HIT3=$(LC_ALL=C grep -r -a -l "感谢支持" ipa/Payload || true)
          echo "命中文件: ${HIT3:-<none>}"
          test -n "$HIT3" || { echo "!! 设置页横幅未编进二进制"; exit 1; }
          # 用 python 字节级统计，不依赖 grep（BSD grep 对二进制超长行/多字节有坑，
          # 且 set -o pipefail 下 grep 无匹配退出码 1 会直接中止 step）
          NQR=$(/usr/bin/python3 - <<'PY'
          import glob, os, sys
          total = 0
          for f in sorted(glob.glob('ipa/Payload/sing-box.app/**/*', recursive=True)):
              if os.path.isfile(f) and not os.path.islink(f):
                  try:
                      c = open(f, 'rb').read().count(b'iVBORw0KGgo')
                  except OSError:
                      c = 0
                  if c:
                      sys.stderr.write('  %4d  %s\n' % (c, f))
                  total += c
          print(total)
          PY
          )
          echo "二进制中 PNG 常量前缀出现次数: $NQR (期望 >= 3)"
          test "$NQR" -ge 3 || { echo "!! 二维码图片数据缺失"; exit 1; }
          echo "--- 三个 Mach-O 的 minos ---"
          for f in ipa/Payload/sing-box.app/sing-box \
                   ipa/Payload/sing-box.app/Frameworks/Library.framework/Library \
                   ipa/Payload/sing-box.app/PlugIns/TVExtension.appex/TVExtension; do
            echo "$(basename "$f"): $(otool -l "$f" | grep -m1 -A4 LC_BUILD_VERSION | grep minos | tr -s ' ')"
          done

      - name: Pack IPA (python zipfile, standard structure)
        run: |
          /usr/bin/python3 - <<'PY'
          import zipfile, os
          out = 'sing-box-tvos16-legacy.ipa'
          root_dir = 'ipa'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk(os.path.join(root_dir, 'Payload')):
                  dirs.sort(); files.sort()
                  for d in dirs:
                      p = os.path.join(root, d)
                      arc = os.path.relpath(p, root_dir) + '/'
                      zi = zipfile.ZipInfo(arc)
                      zi.external_attr = (0o40755 << 16) | 0x10
                      z.writestr(zi, b'')
                  for f in files:
                      p = os.path.join(root, f)
                      arc = os.path.relpath(p, root_dir)
                      z.write(p, arc)
          names = zipfile.ZipFile(out).namelist()
          assert names[0].startswith('Payload/sing-box.app'), names[:3]
          print('packed', out, os.path.getsize(out), 'entries', len(names))
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tvos16-legacy
          path: sing-box-tvos16-legacy.ipa
