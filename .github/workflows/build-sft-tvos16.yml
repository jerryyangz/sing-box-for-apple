name: Build SFT tvOS16 IPA (legacy, Xcode 15)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Select Xcode 15.4 (tvOS 17.5 SDK, Swift 5.10)
        run: |
          ls /Applications | grep Xcode
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i tvos

      - name: Checkout sing-box core (v1.10.7)
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.10.7
          path: core

      - name: Checkout sing-box-for-apple (2024-12-28, v1.10.6, Xcode 15 project)
        uses: actions/checkout@v4
        with:
          repository: jerryyangz/sing-box-for-apple
          ref: 3d889ae0175fb7048d1c0ba229b2ba6c069690a5
          path: apple

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build Libbox (tvOS slice only)
        working-directory: core
        run: |
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile version || true
          go run ./cmd/internal/build_libbox -target apple -platform tvos/arm64
          ls -la Libbox.xcframework

      - name: Place Libbox.xcframework into apple project
        run: |
          cp -R core/Libbox.xcframework apple/Libbox.xcframework

      - name: Archive SFT (unsigned, tvOS 16.1 target)
        working-directory: apple
        run: |
          xcodebuild archive \
            -scheme SFT \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -archivePath build/SFT.xcarchive \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            TVOS_DEPLOYMENT_TARGET=16.1 \
            MARKETING_VERSION=1.10.6 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DISABLE_SWIFTLINT=1 \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tee archive.log || { tail -60 archive.log; exit 1; }

      - name: Assemble IPA payload
        run: |
          APP="apple/build/SFT.xcarchive/Products/Applications/sing-box.app"
          test -d "$APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          # ldid: 注入 entitlements 并 fakesign（TrollStore 保留 entitlements）
          brew install ldid
          ENT_APP="apple/SFT/SFT.entitlements"
          ENT_EXT="apple/TVExtension/TVExtension.entitlements"
          test -f "$ENT_APP"
          test -f "$ENT_EXT"
          ldid -S"$ENT_EXT" "ipa/Payload/sing-box.app/PlugIns/TVExtension.appex/TVExtension"
          FWLIB=$(find ipa/Payload/sing-box.app -name "Library" -path "*Library.framework*" -type f)
          ldid -S "ipa/Payload/sing-box.app/Frameworks/Library.framework" 2>/dev/null || true
          ldid -S "$FWLIB"
          ldid -S"$ENT_APP" "ipa/Payload/sing-box.app/sing-box"
          echo "--- entitlements check (app) ---"
          ldid -e "ipa/Payload/sing-box.app/sing-box" || true
          echo "--- entitlements check (ext) ---"
          ldid -e "ipa/Payload/sing-box.app/PlugIns/TVExtension.appex/TVExtension" || true

      - name: Pack IPA (python zipfile, standard structure)
        run: |
          /usr/bin/python3 - <<'PY'
          import zipfile, os
          out = 'sing-box-tvos16-legacy.ipa'
          with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for root, dirs, files in os.walk('ipa/Payload'):
                  dirs.sort(); files.sort()
                  for d in dirs:
                      p = os.path.join(root, d)
                      zi = zipfile.ZipInfo(p + '/')
                      zi.external_attr = (0o40755 << 16) | 0x10
                      z.writestr(zi, b'')
                  for f in files:
                      p = os.path.join(root, f)
                      z.write(p, p)
          print('packed', out, os.path.getsize(out))
          PY

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-tvos16-legacy
          path: sing-box-tvos16-legacy.ipa
